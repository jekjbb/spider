function nav(){document.getElementById('sidebar').innerHTML=`<div class="brand"><div class="brandmark">✳</div><div><strong>TS SPIDER</strong><small>SAFETY MANAGEMENT</small></div><button type="button" class="menu-close" data-close-menu aria-label="전체 메뉴 닫기">×</button></div>${spotBanner(true)}${groups.map(([g,items])=>`<div class="navlabel">${{OVERVIEW:'주요 메뉴',WORKSPACE:'사업장·작업','SAFETY MANAGEMENT':'안전보건 관리',GOVERNANCE:'운영·자료'}[g]||g}</div>${items.map(([id,t,i])=>`<button type="button" class="navitem ${state.module===id?'active':''}" data-nav="${id}" title="${esc(t)}" ${state.module===id?'aria-current="page"':''}><span class="ico">${i}</span><span>${esc(t)}</span></button>`).join('')}`).join('')}<div class="sidefoot">TS 스파이더 · 종합 안전관리<br>기준법령 확인일 2026.09.23</div>`;document.getElementById('crumb').textContent=title();document.getElementById('modepill').textContent=cloud?`● 클라우드 연결 · ${session?.user?.email||'로그인'}`:'◌ 이 브라우저에 저장';document.querySelectorAll('[data-dock-nav]').forEach(el=>{el.classList?.toggle?.('active',el.dataset.dockNav===state.module);if(el.dataset.dockNav===state.module)el.setAttribute?.('aria-current','page');else el.removeAttribute?.('aria-current')});let all=document.querySelector('.mobile-dock [data-mobile-menu-toggle]'),isOther=!['home','education','risk','tbm'].includes(state.module);all?.classList.toggle('active',isOther);if(isOther)all?.setAttribute('aria-current','page');else all?.removeAttribute('aria-current')}
function mobileMenu(open){document.body?.classList?.toggle?.('mobile-menu-open',open);let side=document.getElementById('sidebar'),main=document.querySelector?.('.main'),dock=document.querySelector?.('.mobile-dock');if(main)main.inert=open;if(dock)dock.inert=open;if(open){side?.setAttribute?.('role','dialog');side?.setAttribute?.('aria-modal','true')}else{side?.removeAttribute?.('role');side?.removeAttribute?.('aria-modal')}document.querySelectorAll('[data-mobile-menu-toggle]').forEach(el=>{el.setAttribute?.('aria-expanded',String(open));el.setAttribute?.('aria-label',open?'전체 메뉴 닫기':'전체 메뉴 열기')});if(open)document.querySelector?.('#sidebar .navitem.active,#sidebar .navitem')?.focus?.()}
function closeMobileMenu(restoreFocus=false){let wasOpen=document.body?.classList?.contains?.('mobile-menu-open');mobileMenu(false);if(wasOpen&&restoreFocus)document.getElementById('menu-toggle')?.focus?.()}
document.addEventListener('click',e=>{if(e.target.closest('[data-mobile-menu-toggle]')){mobileMenu(!document.body?.classList?.contains?.('mobile-menu-open'));return}if(e.target.closest('[data-close-menu]'))closeMobileMenu(true)});
document.addEventListener('keydown',e=>{if(!document.body?.classList?.contains?.('mobile-menu-open'))return;if(e.key==='Escape'){closeMobileMenu(true);return}if(e.key==='Tab'){let visible=[...document.querySelectorAll('#sidebar button,#sidebar a')].filter(el=>el.offsetParent!==null);if(!visible.length)return;let first=visible[0],last=visible[visible.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('resize',()=>{if(window.innerWidth>1020&&document.body?.classList?.contains?.('mobile-menu-open'))closeMobileMenu()});
function go(module,mode='list',id=null){closeMobileMenu();clearTemporary();state.module=module;state.mode=mode;state.editId=id;state.viewId=id;state.filter='';state.statusFilter='all';state.kindFilter='all';state.riskStep=0;state.draft=null;location.hash=module;render();window.scrollTo(0,0)}
function setMode(mode,id=null){if(state.mode==='photo'&&mode!=='photo')clearTemporary();if(state.module==='education'&&state.mode==='form'&&mode!=='form')resetEduPhotos();state.mode=mode;state.editId=id;state.viewId=id;state.riskStep=0;state.draft=id?structuredClone(records.find(r=>r.id===id)?.data||{}):null;render();window.scrollTo(0,0)}
function head(k,desc,extra=''){return `<div class="headrow"><div><div class="overline">TS SPIDER / ${esc(configs[k]?.group||'WORKSPACE')}</div><h1>${esc(title())}</h1><p>${esc(desc)}</p></div><div class="headbtn">${extra}<button class="btn" data-act="print">↧ PDF 보고서</button><button class="btn" data-act="ai">✧ AI 활용</button></div></div>`}
function legalHTML(key){return (laws[key]||[]).map(([n,d,u])=>{let number=n.match(/제(\d+)조/),seq=u===lawBase?'283449':u===decreeBase?'277417':null;if(number&&seq)u=`https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=${number[1].padStart(4,'0')}&lsiSeq=${seq}&urlMode=lsScJoRltInfoR`;else if(number&&u===seriousBase)u=`https://www.law.go.kr/법령/중대재해처벌등에관한법률/제${number[1]}조`;return `<div class="legalcard"><strong>${esc(n)}</strong><p>${esc(d)}</p><a target="_blank" rel="noopener noreferrer" href="${esc(u)}">국가법령정보센터 조문 보기 ↗</a></div>`}).join('')}
function statusBadge(t){let cl=/완료|적합|이수|정상/.test(t)?'good':/필요|미이수|해당/.test(t)?'bad':/중|예정|검토/.test(t)?'warn':'';return `<span class="badge ${cl}">${esc(t||'기록')}</span>`}
function dashboard(){let due=records.filter(r=>r.data.dueDate&&r.data.dueDate<today()&&!/완료/.test(r.data.status||r.data.result||''));let latest=[...records].sort((a,b)=>b.updated.localeCompare(a.updated)).slice(0,5);return `<div class="hero"><span class="eyebrow">TOTAL SAFETY INTELLIGENCE</span><h1>안전의 흐름을 연결하다.</h1><p>사업장부터 작업, 위험성평가, 조치 이행과 보고까지 하나의 기록으로 관리합니다.</p><button class="btn" data-act="print" style="margin-top:18px">↧ 대시보드 PDF</button></div>${spotBanner(false)}<div class="grid stats">${[['등록 사업장',counts('workplace'),'workplace'],['위험성평가',counts('risk'),'risk'],['점검 기록',counts('inspection'),'inspection'],['기한 경과 조치',due.length,'inspection']].map(([a,b,c])=>`<button type="button" class="card stat stat-link" data-nav="${c}"><div class="k">${a}</div><div class="v">${b}</div><div class="note">기록 보기 →</div></button>`).join('')}</div><div class="grid split"><div class="card pad"><h2 class="cardtitle">자주 쓰는 업무</h2><div class="quickgrid">${[['work','작업 등록','작업구분 · 기간 · 공정'],['risk','위험성평가','8단계 평가 흐름'],['inspection','안전점검','점검 · 개선조치'],['education','교육 이수','대상자 · 이수상태'],['tbm','TBM','작업 전 안전공유'],['accident','산업재해조사표','사고 · 재발방지']].map(([k,n,d])=>`<button class="quick" data-create="${k}"><span style="color:#71808a">${configs[k].icon}</span><b>${n} ↗</b><small>${d}</small></button>`).join('')}</div></div><div class="card pad"><h2 class="cardtitle">요청·최근 업무</h2>${latest.length?latest.map(r=>`<button data-open="${r.id}" data-module="${r.module}" class="quick" style="min-height:57px;width:100%;margin-bottom:7px"><b style="margin:0">${esc(r.data.name||'제목 없음')}</b><small>${esc(configs[r.module]?.title)} · ${esc(r.updated.slice(0,10))}</small></button>`).join(''):'<div class="empty">아직 등록된 기록이 없습니다.</div>'}<button class="btn small" data-nav="schedule">일정 보기 →</button></div></div><div class="grid split" style="margin-top:14px"><div class="card pad"><h2 class="cardtitle">법정 의무사항 바로가기</h2>${legalHTML('risk')}${legalHTML('serious')}</div><div class="card pad"><h2 class="cardtitle">예정·기한 관리</h2><div class="smalltext muted">${due.length?due.map(r=>`<p>${esc(r.data.name)} · ${esc(r.data.dueDate)} · ${esc(configs[r.module]?.title)}</p>`).join(''):'현재 기한이 경과한 등록 조치가 없습니다.'}</div><div class="notice">사업장 및 인원 정보는 설정한 저장 방식으로 관리됩니다. 브라우저 저장은 이 기기에서만 조회됩니다.</div></div></div>`}
function formField(f,val){let fieldId=`field-${f.key}`,attrs=`id="${fieldId}" name="${f.key}" aria-label="${esc(f.label)}" ${f.required?'required':''} ${f.type==='number'?'min="0"':''}`,content=f.type==='textarea'?`<textarea ${attrs} placeholder="${esc(f.label)}을(를) 입력하세요">${esc(val)}</textarea>`:f.type==='select'?`<select ${attrs}><option value="">선택</option>${f.options.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input class="input" ${attrs} type="${f.type}" value="${esc(val)}" placeholder="${esc(f.label)}을(를) 입력하세요">`;return `<div class="field ${f.wide?'wide':''}"><label for="${fieldId}">${esc(f.label)} ${f.required?'<span style="color:#ae564e">*</span>':''}</label>${content}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`}
function filteredRecords(k){let data=selection();return k==='safetyTest'&&state.kindFilter!=='all'?data.filter(r=>r.data.kind===state.kindFilter):data}
function recordRows(data){return data.map(r=>`<tr><td data-label="기록명"><strong>${esc(r.data.name||'제목 없음')}</strong></td><td data-label="구분 / 대상">${esc(r.data.kind||r.data.type||r.data.place||r.data.department||r.data.process||'—')}</td><td data-label="일자">${esc(r.data.date||r.data.startDate||'—')}</td><td data-label="상태">${statusBadge(r.data.status||r.data.result||r.data.completion)}</td><td data-label="최종 수정">${esc(r.updated.slice(0,10))}</td><td data-label="관리"><button class="btn small" data-open="${r.id}">보기</button></td></tr>`).join('')||'<tr class="empty-row"><td colspan="6"><div class="empty"><div class="symbol">✳</div>등록된 기록이 없습니다.<br><button class="btn small" style="margin-top:15px" data-act="new">첫 기록 만들기</button></div></td></tr>'}
function listView(k){let cfg=configs[k],data=filteredRecords(k),statuses=[...new Set(records.filter(r=>r.module===k).map(r=>r.data.status||r.data.result||r.data.completion).filter(Boolean))];let tabs=k==='safetyTest'?`<div class="tabs">${[['all','전체 대상품 목록'],['대상품 등록','등록 대상품'],['대상품 제외 검토','대상품 제외 목록'],['안전검사 신청','안전검사 신청 내역'],['대상품 재신청','대상품 재신청 내역']].map(([v,t])=>`<button class="${state.kindFilter===v?'active':''}" data-kind="${v}">${t}</button>`).join('')}</div>`:'';return `${head(k,cfg.desc,`<button class="btn primary" data-act="new">＋ ${esc(cfg.title)} 등록</button>`)}<div class="grid stats">${[['전체 기록',counts(k)],['현재 검색 결과',data.length],['최근 30일',records.filter(r=>r.module===k&&Date.now()-new Date(r.updated).getTime()<30*864e5).length],['조치·검토 필요',records.filter(r=>r.module===k&&/필요|미이수|조치 중|검토/.test(r.data.status||r.data.result||r.data.completion||'')).length]].map(([t,v])=>`<div class="card stat"><div class="k">${t}</div><div class="v" ${t==='현재 검색 결과'?'data-count="filtered"':''}>${v}</div></div>`).join('')}</div><div class="card pad">${tabs}<div class="toolbar"><input class="input search" id="q" placeholder="제목·내용 검색" value="${esc(state.filter)}"><select id="status-filter" style="width:155px"><option value="all">전체 상태</option>${statuses.map(s=>`<option ${state.statusFilter===s?'selected':''}>${esc(s)}</option>`).join('')}</select><button class="btn" data-act="exportcsv">CSV 내보내기</button></div><div class="tablewrap mobile-table-wrap"><table class="table mobile-cards"><thead><tr><th>기록명</th><th>구분 / 대상</th><th>일자</th><th>상태</th><th>최종 수정</th><th>관리</th></tr></thead><tbody id="records-body">${recordRows(data)}</tbody></table></div></div><div class="grid split" style="margin-top:15px"><div class="card pad"><h2 class="cardtitle">업무 흐름</h2><p class="smalltext muted">등록 → 검토 → 조치 → 확인. 이 화면에서 기록을 열어 수정하고, 해당 기록의 보고서를 PDF로 보관할 수 있습니다.</p></div><div class="card pad"><h2 class="cardtitle">관련 법령</h2>${legalHTML(cfg.legal)}</div></div>`}
function formView(k){let cfg=configs[k],d=state.draft||{},special=cfg.special;return `${head(k,state.editId?'저장된 기록을 수정합니다.':'새 기록을 등록합니다.',`<button class="btn" data-act="back">목록 보기</button>`)}${special==='risk'?riskForm(d):`<form class="card pad" id="record-form"><h2 class="cardtitle">${esc(cfg.title)} ${state.editId?'수정':'등록'}</h2><div class="formgrid">${cfg.fields.map(f=>formField(f,d[f.key]??'')).join('')}</div>${special==='checklist'?checklistBuilder(d):''}<div class="formactions"><button class="btn" type="button" data-act="back">취소</button><button class="btn primary" type="submit">저장하기</button></div></form><div class="card pad" style="margin-top:14px"><h2 class="cardtitle">관련 법령</h2>${legalHTML(cfg.legal)}</div>`}`}
function checklistBuilder(d){let sections=d.sections?.length?d.sections:[{name:'구분 1',items:[{name:'점검 항목',detail:''}]}];return `<div id="sections" style="margin-top:25px"><h2 class="cardtitle">점검 항목 구성</h2>${sections.map((s,i)=>`<div class="sectionband" data-section="${i}"><div class="toolbar"><input class="input" data-section-title value="${esc(s.name)}" placeholder="구분 이름"><button type="button" class="btn small danger" data-act="remove-section">삭제</button></div><div class="items">${s.items.map((it,j)=>`<div class="itemrow check"><input class="input" data-item-name value="${esc(it.name)}" placeholder="세부 항목"><input class="input" data-item-detail value="${esc(it.detail)}" placeholder="점검 내용"><select data-item-result><option value="미점검" ${it.result==='미점검'?'selected':''}>미점검</option><option ${it.result==='적합'?'selected':''}>적합</option><option ${it.result==='부적합'?'selected':''}>부적합</option><option ${it.result==='해당 없음'?'selected':''}>해당 없음</option></select><input class="input" data-item-note value="${esc(it.note)}" placeholder="결과 메모"><button type="button" class="btn small danger" data-act="remove-item" aria-label="점검 항목 삭제">삭제</button></div>`).join('')}</div><button type="button" class="btn small" data-act="add-item" style="margin-top:12px">＋ 세부 항목 추가</button></div>`).join('')}</div><button type="button" class="btn" data-act="add-section">＋ 구분 추가</button>`}
function riskForm(d){let rows=d.hazards?.length?d.hazards:[{process:'',hazard:'',likelihood:3,severity:2,measure:'',owner:''}];let panels=[`<div class="formgrid">${configs.risk.fields.map(f=>formField(f,d[f.key]||'')).join('')}</div><div class="notice">평가 구분, 기간과 대상 공정을 먼저 입력하세요. 저장하면 등록번호가 자동 생성됩니다.</div>`,`<div class="formgrid">${formField(F('participants','참여 근로자 명단','textarea',[],true,true),d.participants||'')}${formField(F('representative','근로자대표 참여·요구 여부','select',['요구 없음','요구하여 참여','요구하였으나 미참여']),d.representative||'')}${formField(F('method','참여 방법 및 의견','textarea',[],false,true),d.method||'')}</div>`,`<p class="smalltext muted">위험요인마다 가능성(빈도) 1~5와 중대성(강도) 1~4를 입력합니다. 점수는 두 값의 곱입니다. 내부 문서의 8점 이상은 개선대상으로 표시하며, 15점은 원본 구간이 중복되어 이 화면에서 상위 구간으로 분류합니다.</p><div id="hazards">${rows.map(h=>hazardRow(h)).join('')}</div><button type="button" class="btn" data-act="add-hazard">＋ 유해·위험요인 추가</button>`,`<div class="formgrid">${formField(F('measurePlan','위험 감소대책·우선순위','textarea',[],false,true),d.measurePlan||'')}${formField(F('owner','개선 담당자'),d.owner||'')}${formField(F('dueDate','개선 기한','date'),d.dueDate||'')}${formField(F('status','개선 상태','select',['평가 중','조치 필요','이행 중','조치 완료']),d.status||'')}${formField(F('verified','조치 완료 확인·재평가 결과','textarea',[],false,true),d.verified||'')}</div>`,`<div class="formgrid">${formField(F('meetingDate','평가·개선 회의일','date'),d.meetingDate||'')}${formField(F('meetingMembers','회의 참석자','textarea',[],false,true),d.meetingMembers||'')}${formField(F('meetingNotes','논의사항·결정사항','textarea',[],false,true),d.meetingNotes||'')}</div>`,`<div class="formgrid">${formField(F('sharedDate','근로자 공유일','date'),d.sharedDate||'')}${formField(F('shareMethod','공유 방법','select',['안전보건교육','설명회','사업장 게시','서면·전자적 방법','TBM','기타']),d.shareMethod||'')}${formField(F('sharedContent','공유한 위험요인과 조치 내용','textarea',[],false,true),d.sharedContent||'')}${formField(F('educationEvidence','참석·공유 증빙 보관 위치','text',[],false,true),d.educationEvidence||'')}</div>`,`<div class="formgrid">${formField(F('chemicals','화학물질 및 물질안전보건자료(MSDS) 확인','textarea',[],false,true),d.chemicals||'')}${formField(F('exposure','노출·취급 작업 및 예방조치','textarea',[],false,true),d.exposure||'')}</div>`,`<div id="risk-summary"></div><div class="notice">점수와 건수는 입력 데이터를 기준으로 계산됩니다. 법정 위험성평가 실시 여부와 개선조치 적정성은 담당자가 확인해야 합니다.</div>`];return `<div class="card pad"><div class="steps">${riskSteps.map((x,i)=>`<button class="step ${state.riskStep===i?'on':''}" data-step="${i}">${String(i+1).padStart(2,'0')} ${x}</button>`).join('')}</div><form id="risk-form"><h2 class="cardtitle">${state.riskStep+1}. ${riskSteps[state.riskStep]}</h2><div id="stepbody">${panels[state.riskStep]}</div><div class="formactions"><button type="button" class="btn" data-act="back">목록</button>${state.riskStep>0?'<button type="button" class="btn" data-act="prev-step">이전</button>':''}<button type="button" class="btn" data-act="save-draft">현재 내용 저장</button><button type="button" class="btn" data-act="print">↧ 현재 평가표 PDF</button>${state.riskStep<7?'<button type="button" class="btn primary" data-act="next-step">다음 단계 →</button>':'<button type="submit" class="btn primary">평가 완료·저장</button>'}</div></form></div><div class="card pad" style="margin-top:15px"><h2 class="cardtitle">관련 법령</h2>${legalHTML('risk')}</div>`}

function detailView(k){let r=records.find(x=>x.id===state.viewId);if(!r)return setMode('list');let cfg=configs[k],entries=cfg.fields.map(f=>[f.label,r.data[f.key]]).filter(x=>x[1]);let extra=k==='risk'?`<div class="card pad" style="margin-top:15px"><h2 class="cardtitle">유해·위험요인 평가표</h2><div class="tablewrap mobile-table-wrap"><table class="table mobile-cards"><thead><tr><th>공정</th><th>위험요인</th><th>가능성</th><th>중대성</th><th>점수</th><th>감소대책</th></tr></thead><tbody>${(r.data.hazards||[]).map(h=>`<tr><td data-label="공정">${esc(h.process)}</td><td data-label="위험요인">${esc(h.hazard)}</td><td data-label="가능성">${esc(h.likelihood)}</td><td data-label="중대성">${esc(h.severity)}</td><td data-label="점수">${riskLevel((Number(h.likelihood)||0)*(Number(h.severity)||0))}</td><td data-label="감소대책">${esc(h.measure)}</td></tr>`).join('')}</tbody></table></div></div><div class="card pad" style="margin-top:15px"><h2 class="cardtitle">참여 · 개선 · 교육 · 이행</h2><div class="detail"><dl>${Object.entries({participants:'참여 근로자',representative:'근로자대표',method:'참여 의견',measurePlan:'개선대책',owner:'조치 담당자',dueDate:'기한',status:'상태',verified:'이행 확인',meetingNotes:'회의 결과',sharedContent:'근로자 공유 내용',shareMethod:'공유 방법',chemicals:'화학물질',exposure:'노출·예방조치'}).map(([key,label])=>`<div><dt>${label}</dt><dd>${esc(r.data[key]||'—')}</dd></div>`).join('')}</dl></div></div>`:k==='checklist'?`<div class="card pad" style="margin-top:15px"><h2 class="cardtitle">체크리스트 점검 항목</h2>${(r.data.sections||[]).map(s=>`<h3>${esc(s.name)}</h3><div class="tablewrap mobile-table-wrap"><table class="table mobile-cards"><thead><tr><th>세부 항목</th><th>점검 내용</th><th>결과</th><th>메모</th></tr></thead><tbody>${s.items.map(i=>`<tr><td data-label="세부 항목">${esc(i.name)}</td><td data-label="점검 내용">${esc(i.detail)}</td><td data-label="결과">${esc(i.result)}</td><td data-label="메모">${esc(i.note)}</td></tr>`).join('')}</tbody></table></div>`).join('')}</div>`:'';return `${head(k,'등록된 기록 상세 내용입니다.',`<button class="btn" data-act="back">목록</button><button class="btn" data-act="photo-report">사진 포함 보고서</button><button class="btn primary" data-edit="${r.id}">수정</button>`)}<div class="card pad"><div class="headrow"><div><span class="overline">NO. ${esc(r.id.slice(0,8).toUpperCase())} · ${esc(r.created.slice(0,10))}</span><h2>${esc(r.data.name||'제목 없음')}</h2></div><div class="headbtn">${statusBadge(r.data.status||r.data.result||r.data.completion)}<button class="btn small danger no-print" data-delete="${r.id}">삭제</button></div></div><div class="detail"><dl>${entries.map(([label,v])=>`<div><dt>${esc(label)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></div></div>${extra}<div class="card pad" style="margin-top:15px"><h2 class="cardtitle">관련 법령</h2>${legalHTML(cfg.legal)}</div>`}
function lawView(){let sections=[['산업안전보건법','사업장 운영·교육·위험성평가·도급·사고·검사',lawBase,['management','committee','education','risk','inspection','accident','contractor','equipment']],['중대재해 처벌 등에 관한 법률','경영책임자등의 의무 및 재발방지',seriousBase,['serious']],['중대재해 처벌 등에 관한 법률 시행령','체계 구축·이행 점검의 세부 조치',decreeBase,['serious']]];return `${head('law','업무별 법령 조문과 원문을 함께 확인합니다.')}<div class="notice">기준 확인일: 2026.09.23. 연결된 국가법령정보센터의 시행일과 최신 개정문을 직접 확인하세요. 법 적용 대상과 세부 요건은 사업장 유형·규모에 따라 달라집니다.</div>${sections.map(([name,description,url,keys])=>`<div class="card pad" style="margin:12px 0"><div class="headrow"><div><h2 class="cardtitle">${name}</h2><p class="muted smalltext">${description}</p></div><a class="btn" target="_blank" rel="noopener noreferrer" href="${url}">전체 법령 보기 ↗</a></div>${keys.map(key=>legalHTML(key)).join('')}</div>`).join('')}`}
function calendarView(){let d=new Date(state.calYear,state.calMonth,1),first=d.getDay(),days=new Date(state.calYear,state.calMonth+1,0).getDate(),ym=`${state.calYear}-${String(state.calMonth+1).padStart(2,'0')}`;return `${head('schedule','점검·교육·회의 및 개인 일정을 등록합니다.',`<button class="btn primary" data-act="new">＋ 일정 등록</button>`)}<div class="grid split"><div class="card pad"><div class="datebar"><button class="btn small" data-act="prev-month">‹</button><h2 class="cardtitle" style="margin:0">${state.calYear}년 ${state.calMonth+1}월</h2><button class="btn small" data-act="next-month">›</button></div><div class="calendar">${['일','월','화','수','목','금','토'].map(x=>`<div class="calhead">${x}</div>`).join('')}${Array(first).fill('<div style="border:0"></div>').join('')}${Array.from({length:days},(_,i)=>{let date=`${ym}-${String(i+1).padStart(2,'0')}`,rs=records.filter(r=>r.data.date?.slice(0,10)===date);return `<div class="${rs.length?'has':''}">${i+1}${rs.slice(0,2).map(r=>`<button data-open="${r.id}" data-module="${r.module}" title="${esc(r.data.name)}" style="display:block;border:0;background:transparent;font-size:9px;color:#596973;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">● ${esc(r.data.name)}</button>`).join('')}</div>`}).join('')}</div><div class="mobile-agenda"><h3>${state.calMonth+1}월 일정</h3>${records.filter(r=>r.data.date?.slice(0,7)===ym).sort((a,b)=>(a.data.date||'').localeCompare(b.data.date||'')).map(r=>`<button type="button" data-open="${esc(r.id)}" data-module="${esc(r.module)}"><time>${esc(r.data.date.slice(5,10))}</time><span>${esc(r.data.name||'제목 없음')} · ${esc(configs[r.module]?.title||'일정')}</span></button>`).join('')||'<p class="smalltext muted">이 달에 등록된 일정이 없습니다.</p>'}</div></div><div class="card pad"><h2 class="cardtitle">등록 일정</h2>${records.filter(r=>r.module==='schedule').sort((a,b)=>(a.data.date||'').localeCompare(b.data.date||'')).map(r=>`<div style="border-bottom:1px solid var(--line);padding:12px 0"><b>${esc(r.data.date)}</b> · ${esc(r.data.name)} <button class="btn small" data-open="${r.id}">보기</button></div>`).join('')||'<div class="empty">등록된 일정이 없습니다.</div>'}</div></div>`}
function dataView(){let distribution=[['사업장',counts('workplace')],['작업',counts('work')],['위험성평가',counts('risk')],['안전점검',counts('inspection')],['교육',counts('education')],['TBM',counts('tbm')],['산업재해',counts('accident')],['도급사업',counts('contractor')]];return `${head('data','모듈별 기록을 집계하고 데이터 파일을 관리합니다.',`<button class="btn" data-act="exportjson">전체 백업 JSON</button>`)}<div class="grid stats">${[['전체 기록',records.length],['사업장',counts('workplace')],['위험성평가',counts('risk')],['안전점검',counts('inspection')]].map(([l,v])=>`<div class="card stat"><div class="k">${l}</div><div class="v">${v}</div></div>`).join('')}</div><div class="grid split"><div class="card pad"><h2 class="cardtitle">업무별 현황</h2>${distribution.map(([n,v])=>`<div style="display:flex;align-items:center;gap:14px;margin:12px 0;font-size:11px"><div style="width:85px">${n}</div><div style="flex:1;height:9px;background:#edf0f1;border-radius:8px"><div style="width:${records.length?Math.max(3,v/records.length*100):0}%;height:9px;background:linear-gradient(90deg,#48555e,#9da8ae);border-radius:8px"></div></div><b>${v}</b></div>`).join('')}</div><div class="card pad"><h2 class="cardtitle">백업 및 연결</h2><p class="smalltext muted">전체 백업 JSON은 현재 저장 공간에 보이는 기록을 파일로 내보냅니다. 복원은 기존 기록과 ID를 기준으로 병합합니다.</p><label class="btn" for="import-file" style="display:inline-block">JSON 백업 복원</label><input id="import-file" type="file" accept="application/json,.json" style="display:none"><div class="notice">${cloud?'현재 로그인 계정에 허용된 기록을 조회합니다.':'현재는 이 브라우저에 저장됩니다. 설정에서 Supabase를 연결하면 로그인 계정별 클라우드 저장으로 전환됩니다.'}</div><button class="btn" data-act="settings">저장 방식 설정 →</button></div></div>`}
function render(){nav();let k=state.module;let html=k==='education'?educationView():k==='tbm'&&state.mode==='list'?tbmHub():k==='spot444'?spotView():k==='timeline'?timelineView():state.mode==='photo'?photoView():k==='home'?dashboard():k==='law'?lawView():k==='data'?dataView():k==='schedule'&&state.mode==='list'?calendarView():state.mode==='form'?formView(k):state.mode==='detail'?detailView(k):listView(k);document.getElementById('appview').innerHTML=`<div class="print-head report-only">TS SPIDER · ${esc(title())} / 출력일 ${today()} / ${cloud?'연결 계정':'이 브라우저의 기록'}</div>${html}<div class="pagefooter">TS SPIDER · SAFETY MANAGEMENT PLATFORM · © TS</div>`;if(k==='risk'&&state.mode==='form'&&state.riskStep===7)summary();if(window.innerWidth<=760){let selected=document.querySelector('#appview .steps .step.on,#appview .tabs button.active');if(selected){let strip=selected.parentElement;strip.scrollLeft=Math.max(0,selected.offsetLeft-strip.offsetLeft-(strip.clientWidth-selected.offsetWidth)/2)}}}
function summary(){let d=state.draft||{},h=d.hazards||[],scores=h.map(x=>(+x.likelihood||0)*(+x.severity||0));let node=document.getElementById('risk-summary');if(node)node.innerHTML=`<div class="grid stats"><div class="card stat"><div class="k">위험요인</div><div class="v">${h.length}</div></div><div class="card stat"><div class="k">최고 점수</div><div class="v">${Math.max(0,...scores)}</div></div><div class="card stat"><div class="k">개선대책 입력</div><div class="v">${h.filter(x=>x.measure).length}</div></div><div class="card stat"><div class="k">근로자 참여 기록</div><div class="v">${d.participants?'있음':'없음'}</div></div></div>`}
async function api(path,opts={}){if(!config.url||!config.key)throw Error('Supabase 프로젝트 URL과 publishable key를 설정하세요.');if(session?.expires_at&&Date.now()>session.expires_at-60e3)await refreshSession();let url=config.url.replace(/\/$/,'')+path;let response=await fetch(url,{...opts,headers:{'apikey':config.key,...(session?.access_token?{'Authorization':`Bearer ${session.access_token}`}:{}) ,...(opts.body?{'Content-Type':'application/json'}:{}),...opts.headers}});let body=await response.text(),data;try{data=body?JSON.parse(body):null}catch{data=body}if(!response.ok)throw Error(data?.message||data?.msg||data?.error_description||data?.error||`HTTP ${response.status}`);return data}
async function refreshSession(){if(!session?.refresh_token)throw Error('로그인이 필요합니다.');let response=await fetch(config.url.replace(/\/$/,'')+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:config.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});let data=await response.json();if(!response.ok){session=null;localStorage.removeItem(SESSION);cloud=false;throw Error(data.msg||'로그인 갱신에 실패했습니다. 다시 로그인하세요.')}session={...data,expires_at:Date.now()+(data.expires_in||3600)*1000};localStorage.setItem(SESSION,JSON.stringify(session))}
async function login(email,password){let response=await fetch(config.url.replace(/\/$/,'')+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:config.key,'Content-Type':'application/json'},body:JSON.stringify({email,password})});let d=await response.json();if(!response.ok)throw Error(d.msg||d.error_description||'로그인 실패');session={...d,expires_at:Date.now()+(d.expires_in||3600)*1000};localStorage.setItem(SESSION,JSON.stringify(session));await loadCloud();cloud=true;render();notify('클라우드에 연결했습니다. 이 계정의 기록을 불러왔습니다.')}
async function loadCloud(){if(!session?.user?.id)throw Error('로그인이 필요합니다.');let data=await api(`/rest/v1/spider_records?select=id,module,data,created_at,updated_at&owner_id=eq.${encodeURIComponent(session.user.id)}&order=updated_at.desc&limit=2000`);records=data.map(r=>({id:r.id,module:r.module,data:r.data,created:r.created_at,updated:r.updated_at}))}
async function persist(r){if(cloud){await api('/rest/v1/spider_records?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:r.id,owner_id:session.user.id,module:r.module,data:r.data,created_at:r.created,updated_at:r.updated})});let idx=records.findIndex(x=>x.id===r.id);if(idx<0)records.push(r);else records[idx]=r}else{let updated=[...records.filter(x=>x.id!==r.id),r];localStorage.setItem(KEY,JSON.stringify(updated));records=updated}}
async function removeRecord(id){let r=records.find(x=>x.id===id);if(!r)return;if(!confirm(`'${r.data.name}' 기록을 삭제할까요?`))return;try{if(cloud){await api(`/rest/v1/spider_records?id=eq.${encodeURIComponent(id)}&owner_id=eq.${encodeURIComponent(session.user.id)}`,{method:'DELETE'})}else localStorage.setItem(KEY,JSON.stringify(records.filter(x=>x.id!==id)));records=records.filter(x=>x.id!==id);setMode('list');notify('기록을 삭제했습니다.')}catch(e){notify(`삭제 실패: ${e.message}`)}}
async function save(data,stay=false){let existing=records.find(x=>x.id===state.editId),r={id:existing?.id||uid(),module:state.module,data,created:existing?.created||new Date().toISOString(),updated:new Date().toISOString()};try{await persist(r);state.editId=r.id;state.draft=structuredClone(data);notify(cloud?'클라우드에 저장했습니다.':'이 브라우저에 저장했습니다.');if(!stay)setMode('detail',r.id)}catch(e){notify(`저장 실패: ${e.message}`)}}
function download(filename,content,mime){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type:mime}));a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportCsv(){let cfg=configs[state.module],cols=['ID',...cfg.fields.map(f=>f.label),'최종 수정'];let v=selection().map(r=>[r.id,...cfg.fields.map(f=>r.data[f.key]||''),r.updated]);let csv='\ufeff'+[cols,...v].map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(`TS스파이더_${cfg.title}_${today()}.csv`,csv,'text/csv;charset=utf-8')}
function sql(){return `-- Supabase SQL Editor에서 실행 (계정별 비공개 저장)\ncreate table if not exists public.spider_records (\n  id uuid primary key,\n  owner_id uuid not null references auth.users(id) on delete cascade,\n  module text not null,\n  data jsonb not null default '{}'::jsonb,\n  created_at timestamptz not null default now(),\n  updated_at timestamptz not null default now()\n);\ncreate index if not exists spider_records_owner_updated_idx\n  on public.spider_records(owner_id,updated_at desc);\nalter table public.spider_records enable row level security;\nrevoke all on public.spider_records from anon;\ngrant select,insert,update,delete on public.spider_records to authenticated;\ndrop policy if exists spider_select_own on public.spider_records;\ndrop policy if exists spider_insert_own on public.spider_records;\ndrop policy if exists spider_update_own on public.spider_records;\ndrop policy if exists spider_delete_own on public.spider_records;\ncreate policy spider_select_own on public.spider_records for select to authenticated using ((select auth.uid()) = owner_id);\ncreate policy spider_insert_own on public.spider_records for insert to authenticated with check ((select auth.uid()) = owner_id);\ncreate policy spider_update_own on public.spider_records for update to authenticated using ((select auth.uid()) = owner_id) with check ((select auth.uid()) = owner_id);\ncreate policy spider_delete_own on public.spider_records for delete to authenticated using ((select auth.uid()) = owner_id);`}
function settings(){document.getElementById('overlay').innerHTML=`<div class="modalback" data-dismiss="1"><div class="modal"><button class="btn small close" data-act="close">닫기 ×</button><div class="overline">CONNECTION SETTINGS</div><h2>저장 · AI 연결 설정</h2><p class="smalltext muted">설정 전에는 이 브라우저에만 저장됩니다. 클라우드 사용에는 Supabase 프로젝트, 아래 테이블, 등록된 사용자 계정이 필요합니다.</p><div class="settinggrid"><div class="field"><label>Supabase 프로젝트 URL (https://...supabase.co)</label><input class="input" id="cfg-url" value="${esc(config.url)}" placeholder="https://project.supabase.co"></div><div class="field"><label>Publishable key (sb_publishable_... 또는 기존 anon key)</label><input class="input" id="cfg-key" value="${esc(config.key)}" placeholder="sb_publishable_..."></div><div class="field"><label>AI Edge Function 이름</label><input class="input" id="cfg-fn" value="${esc(config.fn||'spider-ai')}"></div></div><div class="toolbar" style="margin:15px 0"><button class="btn primary" data-act="save-config">설정 저장</button><button class="btn" data-act="copy-sql">테이블·RLS SQL 복사</button></div><details><summary class="smalltext">테이블 생성 SQL 보기</summary><pre id="sql-view">${esc(sql())}</pre></details><div class="notice">클라우드 저장은 로그인 후에만 활성화됩니다. 로그인하면 해당 계정의 클라우드 기록으로 화면이 전환됩니다. 이 브라우저 기록은 자동 업로드되지 않습니다. 사내 공동 열람·승인 권한은 별도의 조직별 정책이 필요합니다.</div><div class="settinggrid"><div class="field"><label>이메일</label><input class="input" id="login-email" type="email" autocomplete="username" placeholder="사용자 계정 이메일"></div><div class="field"><label>비밀번호</label><input class="input" id="login-password" type="password" autocomplete="current-password" placeholder="비밀번호"></div></div><div class="toolbar" style="margin-top:15px"><button class="btn primary" data-act="login">로그인·클라우드 불러오기</button><button class="btn" data-act="logout">로그아웃·브라우저 저장으로 전환</button></div><details><summary class="smalltext">AI 서버 함수 연결 규격</summary><pre>POST /functions/v1/spider-ai\nAuthorization: Bearer &lt;로그인 사용자의 JWT&gt;\napikey: &lt;publishable key&gt;\n요청 JSON: {"provider":"openai|anthropic|google|internal","task":"draft|hazards|measures|checklist|summary","module":"risk","prompt":"..."}\n응답 JSON: {"answer":"AI가 생성한 텍스트"}</pre></details><p class="smalltext muted">AI는 Edge Function에서 선택된 공급자를 서버 측 비밀 키로 호출하도록 배포해야 동작합니다. 함수에서 사용자 인증, 입력 제한, CORS와 외부 서비스 연결을 설정하세요. 이 정적 HTML에는 모델 API 키를 넣지 않습니다.</p></div></div>`}
function aiModal(){let mod=configs[state.module]?.title||title();let current=state.mode==='detail'?records.find(r=>r.id===state.viewId)?.data:state.mode==='form'?state.draft:null;document.getElementById('overlay').innerHTML=`<div class="modalback" data-dismiss="1"><div class="modal"><button class="btn small close" data-act="close">닫기 ×</button><div class="overline">ASSISTED WORKFLOW</div><h2>생성형 AI 활용</h2><p class="smalltext muted">현재 메뉴: ${esc(mod)}. 연결된 서버 함수가 있을 때 선택한 AI에 요청합니다. 기록의 개인정보·민감정보는 입력 전에 확인하세요.</p><div class="settinggrid"><div class="field"><label>모델 선택</label><select id="ai-provider"><option value="openai">OpenAI</option><option value="anthropic">Claude</option><option value="google">Gemini</option><option value="internal">사내 모델</option></select></div><div class="field"><label>기능 선택</label><select id="ai-task"><option value="draft">보고서 초안</option><option value="hazards">유해·위험요인 아이디어</option><option value="measures">개선대책 검토</option><option value="checklist">점검항목 제안</option><option value="summary">요약 및 미기재 사항</option></select></div></div><div class="field" style="margin-top:14px"><label>요청 내용</label><textarea id="ai-prompt" placeholder="어떤 작업이나 현장을 검토할지 구체적으로 입력하세요"></textarea></div><label class="smalltext"><input type="checkbox" id="ai-context" ${current?'checked':''}> 현재 기록 내용을 요청에 포함 (${current?'개인정보 등 확인 필요':'선택된 기록 없음'})</label><div class="toolbar" style="margin-top:15px"><button class="btn primary" data-act="run-ai">AI 실행</button><button class="btn" data-act="copy-prompt">프롬프트 복사</button></div><div class="output" id="ai-output">AI 연결 전에도 프롬프트 복사 기능을 사용할 수 있습니다. 생성 결과는 담당자가 사실관계와 법령 적합성을 검토한 뒤 반영하세요.</div><div class="toolbar" style="margin-top:12px"><button class="btn" data-act="copy-output">결과 복사</button></div></div></div>`}
function buildPrompt(){let task=document.getElementById('ai-task').selectedOptions[0].textContent,k=state.module,current=state.mode==='detail'?records.find(r=>r.id===state.viewId)?.data:state.mode==='form'?state.draft:null;return `TS 스파이더 ${title()} / ${task}\n업무 요청: ${document.getElementById('ai-prompt').value.trim()}\n확인할 법령: ${(laws[configs[k]?.legal]||[]).map(x=>x[0]).join(', ')}\n${document.getElementById('ai-context').checked&&current?'현재 기록: '+JSON.stringify(current):''}\n지시: 입력된 사실만 사용하고, 추정은 추정으로 표시하세요. 법령 적용 여부는 직접 판정하지 말고 확인할 조문과 검증 항목을 구분하세요.`}
async function runAI(){let out=document.getElementById('ai-output');if(!cloud){out.textContent='AI 사용에는 Supabase 로그인과 서버 측 Edge Function 연결이 필요합니다. 설정에서 연결한 뒤 다시 실행하세요.';return}let prompt=buildPrompt(),provider=document.getElementById('ai-provider').value,task=document.getElementById('ai-task').value;out.textContent='서버에 요청하는 중…';try{let name=config.fn||'spider-ai';if(!/^[\w-]+$/.test(name))throw Error('Edge Function 이름이 올바르지 않습니다.');let data=await api(`/functions/v1/${name}`,{method:'POST',body:JSON.stringify({provider,task,module:state.module,prompt})});out.textContent=typeof data==='string'?data:(data?.answer||data?.text||data?.output||JSON.stringify(data,null,2))}catch(e){out.textContent=`AI 요청 실패: ${e.message}\n서버 함수가 배포되었는지, 인증·CORS·모델 키 설정을 확인하세요.`}}

function timelineView(){let months=['all','01~06','02','03','04','06','06~08','09','10','12','매월','4·14·24일','반기','상·하반기','매주','분기','해당 시'];return `${head('timeline','2026년 지역본부·검사소 안전보건 업무의 시기·담당·제출물을 연결합니다.')}<div class="notice">출처: 「안전보건업무 타임라인(1)」(2026), 표기된 쪽수. 일정과 적용 대상은 해당 연도 안전보건실 공문으로 최종 확인하세요. 이행 기록은 선택한 저장 방식으로 저장됩니다.</div><div class="toolbar"><label class="smalltext">시기 필터</label><select id="timeline-filter" style="width:170px">${months.map(m=>`<option value="${m}" ${state.timelineMonth===m?'selected':''}>${m==='all'?'전체 일정':m}</option>`).join('')}</select><span class="muted smalltext">4·14·24일 양식은 별도 배너에서 작성합니다.</span></div><div class="timeline-list">${timelineItems.filter(t=>state.timelineMonth==='all'||t.month===state.timelineMonth).map(t=>{let r=records.find(x=>x.module==='timelineTask'&&x.data.taskId===t.id);return `<article class="card timeline-card"><div class="month">${esc(t.month)} · 문서 ${t.page}쪽</div><h3>${esc(t.name)}</h3><p>담당: ${esc(t.who)}<br>준비·제출: ${esc(t.output)}</p><div class="meta">이행상태: <b>${esc(r?.data.status||'미기록')}</b>${r?.data.memo?` · ${esc(r.data.memo)}`:''}</div><div class="toolbar" style="margin:12px 0 0"><button class="btn small" data-timelog="${t.id}">이행 기록</button><button class="btn small" data-nav="${t.link}">${t.link==='spot444'?'점검표 작성':'관련 메뉴'} ↗</button></div></article>`}).join('')}</div>`}
function timelineLog(id){let task=timelineItems.find(x=>x.id===id),r=records.find(x=>x.module==='timelineTask'&&x.data.taskId===id);document.getElementById('overlay').innerHTML=`<div class="modalback"><div class="modal"><button class="btn small close" data-act="close">닫기 ×</button><h2>${esc(task.name)}</h2><p class="smalltext muted">일정: ${esc(task.month)} · 근거: 내부 타임라인 ${task.page}쪽</p><input type="hidden" id="tl-id" value="${esc(id)}"><div class="formgrid"><div class="field"><label>진행 상태</label><select id="tl-status">${['미기록','예정','진행 중','완료','해당 없음'].map(v=>`<option ${r?.data.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>확인일</label><input class="input" type="date" id="tl-date" value="${esc(r?.data.date||'')}"></div><div class="field"><label>담당자</label><input class="input" id="tl-owner" value="${esc(r?.data.owner||'')}"></div><div class="field"><label>증빙 문서명·위치</label><input class="input" id="tl-evidence" value="${esc(r?.data.evidence||'')}"></div><div class="field wide"><label>이행 메모</label><textarea id="tl-memo">${esc(r?.data.memo||'')}</textarea></div></div><div class="formactions"><button class="btn primary" data-act="save-timelog">이행 기록 저장</button></div></div></div>`}
async function saveTimelog(){let id=document.getElementById('tl-id').value,t=timelineItems.find(x=>x.id===id),existing=records.find(x=>x.module==='timelineTask'&&x.data.taskId===id);if(!t)throw Error('일정 항목을 찾지 못했습니다.');let now=new Date().toISOString();let r={id:existing?.id||uid(),module:'timelineTask',created:existing?.created||now,updated:now,data:{taskId:id,name:t.name,status:document.getElementById('tl-status').value,date:document.getElementById('tl-date').value,owner:document.getElementById('tl-owner').value.trim(),evidence:document.getElementById('tl-evidence').value.trim(),memo:document.getElementById('tl-memo').value.trim()}};await persist(r);document.getElementById('overlay').innerHTML='';render();notify('이행 기록을 저장했습니다.')}
function photoEditor(){return `<div class="card pad"><h2 class="cardtitle">개선 전·후 사진</h2><div class="notice warn">사진은 이 화면의 메모리에만 남습니다. 브라우저 저장·Supabase 저장·JSON 백업 대상에서 제외됩니다. 다른 메뉴로 이동하거나 새로고침하면 첨부 사진과 임시 입력이 사라집니다.</div><div id="photo-pairs">${photoPairs.map((p,i)=>photoPairHTML(p,i)).join('')}</div><button class="btn" data-act="add-photo">＋ 사진 세트 추가</button></div>`}

function spotView(){if(!photoPairs.length)photoPairs=[{}];let template=spotTemplates[state.spotType],values=spotForm.results||[];return `${head('spot444','내부 4.4.4 점검표를 화면에서 작성해 A4 PDF로 출력합니다.')}<div class="notice warn">임시 양식입니다. 이 페이지를 떠나면 항목 선택·입력·사진이 초기화됩니다. 점검 결과와 사진은 브라우저 저장소나 Supabase에 저장하지 않습니다.</div><div class="tabs">${spotTemplates.map((x,i)=>`<button class="${state.spotType===i?'active':''}" data-spot-tab="${i}">매월 ${x.day}일 · ${esc(x.title)}</button>`).join('')}</div><div class="card pad"><div class="overline">4.4.4 SAFETY INSPECTION · 매월 ${template.day}일</div><h2>${esc(template.title)}</h2><div class="formgrid" id="spot-head">${[['site','사업장명','text'],['date','점검일자','date'],['place','점검장소','text'],['inspector','점검자','text'],['riskLead','위험성평가 담당자','text'],['supervisor','관리감독자','text']].map(([k,l,t])=>`<div class="field"><label>${l}</label><input class="input" name="${k}" type="${t}" aria-label="${esc(l)}" value="${esc(spotForm[k]??(k==='date'?today():''))}"></div>`).join('')}</div><h3 class="cardtitle" style="margin-top:24px">점검 항목 · ${template.items.length}개</h3><div id="spot-results">${template.items.map((item,i)=>`<div class="spot-row"><span>${String(i+1).padStart(2,'0')}</span><span>${esc(item)}</span><select data-spot-result="${i}" aria-label="${i+1}번 점검결과"><option value="" ${!values[i]?'selected':''}>미점검</option><option value="양호" ${values[i]==='양호'?'selected':''}>양호</option><option value="불량" ${values[i]==='불량'?'selected':''}>불량</option></select></div>`).join('')}</div><div class="field" style="margin-top:20px"><label>불량사항에 대한 보완 필요사항</label><textarea id="spot-issue" placeholder="불량 항목, 임시조치, 조치담당자·기한 등을 입력하세요">${esc(spotForm.issue||'')}</textarea></div></div><div style="margin-top:15px">${photoEditor()}</div><div class="card pad" style="margin-top:15px"><h2 class="cardtitle">보고서 출력</h2><p class="smalltext muted">점검 결과와 사진이 흰색 A4 양식에 반영됩니다. 이 페이지를 벗어나면 작성 중인 내용은 지워집니다.</p><button class="btn primary" data-act="print">↧ 4.4.4 점검표 PDF 출력</button></div>`}

function riskReport(d,{id='',updated='',photos=false}={}){
 let hazards=Array.isArray(d.hazards)?d.hazards:[],scored=hazards.map(h=>{let a=Number(h.likelihood),b=Number(h.severity);return Number.isInteger(a)&&a>=1&&a<=5&&Number.isInteger(b)&&b>=1&&b<=4?a*b:0}),riskRows=hazards.length?hazards.map((h,i)=>[i+1,h.process,h.hazard,h.likelihood,h.severity,scored[i]?riskLevel(scored[i]):'미산정',h.measure]):[['','','','','','미산정','']];
 let section=(name,content)=>`<section class="report-section risk-report-section"><h2>${esc(name)}</h2>${content}</section>`,t=(labels,keys)=>reportTable(labels,[keys.map(k=>d[k]||'')]);
 let body=section('01 사전 준비',`${t(['평가 구분','평가명','평가 시작일'],['type','name','startDate'])}${reportTable(['종료일','대상 공정·작업','대상 부서','평가 장소'],[[d.endDate,d.process,d.department,d.place]])}`)
 +section('02 근로자 참여',`${t(['참여 근로자 명단','근로자대표 참여·요구 여부'],['participants','representative'])}${t(['참여 방법 및 의견'],['method'])}`)
 +section('03 유해·위험요인 평가표',`<p>위험성 점수 = 가능성(빈도) × 중대성(강도). 1~5점과 1~4점을 각각 입력한 기록으로 계산합니다.</p>${reportTable(['No','공정·작업','유해·위험요인','빈도','강도','위험수준','감소대책'],riskRows)}<p>등록 ${hazards.length}건 · 최고 ${Math.max(0,...scored)}점 · 감소대책 입력 ${hazards.filter(h=>h.measure).length}건</p>`)
 +section('04 개선조치 계획 및 확인',`${t(['우선순위 및 위험 감소대책','개선 담당자','개선 기한','개선 상태'],['measurePlan','owner','dueDate','status'])}${t(['조치 완료 확인·재평가 결과'],['verified'])}`)
 +section('05 평가·개선 회의',`${t(['회의일','회의 참석자'],['meetingDate','meetingMembers'])}${t(['논의사항·결정사항'],['meetingNotes'])}`)
 +section('06 근로자 교육·공유',`${t(['공유일','공유 방법','증빙 보관 위치'],['sharedDate','shareMethod','educationEvidence'])}${t(['공유한 위험요인과 조치 내용'],['sharedContent'])}`)
 +section('07 화학물질 위험성평가',`${t(['화학물질 및 MSDS 확인'],['chemicals'])}${t(['노출·취급 작업 및 예방조치'],['exposure'])}`)
 +section('08 통계·이행 확인',reportTable(['평가 위험요인','최고 점수','8점 이상','개선대책 기록','근로자 참여'],[[hazards.length,Math.max(0,...scored),scored.filter(n=>n>=8).length,hazards.filter(h=>h.measure).length,d.participants?'있음':'미기재']]))+(photos?reportPhotos():'');
 return reportWrap('위험성평가 보고서',`${d.name||'평가명 미입력'} · ${id?'기록번호 '+id.slice(0,8):'작성 중'}${updated?' · 최종 수정 '+updated.slice(0,10):''}`,`<div class="risk-pdf">${body}</div>`)

function recordReport(r){let cfg=configs[r.module],fields=cfg.fields.map(f=>[f.label,r.data[f.key]]).filter(([,v])=>v!==undefined&&v!==null&&v!=='');let body=`<section class="report-section"><h2>기본 정보</h2><dl>${fields.map(([l,v])=>`<div class="report-entry"><dt>${esc(l)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></section>`;if(r.module==='risk')return riskReport(r.data,{id:r.id,updated:r.updated,photos:state.mode==='photo'&&state.viewId===r.id});if(r.module==='checklist')body+=(r.data.sections||[]).map(s=>`<section class="report-section"><h2>${esc(s.name)}</h2>${reportTable(['항목','점검내용','결과','메모'],s.items.map(i=>[i.name,i.detail,i.result,i.note]))}</section>`).join('');if(state.mode==='photo'&&state.viewId===r.id)body+=reportPhotos();return reportWrap(cfg.title,`${r.data.name||'기록'} · 기록번호 ${r.id.slice(0,8)} · 최종 수정 ${r.updated.slice(0,10)}`,body)}

function eduJournalFields(d){return `${eduCommon(d,'journal')}<div class="edu-panel"><h3>교육 인원 및 이수 결과</h3><div class="formgrid">${ef('targetCount','교육 대상자 수',d.targetCount||'','number')}${ef('completedCount','교육 이수자 수',d.completedCount||'','number')}${ef('missingCount','교육 미이수자 수',d.missingCount||'','number')}${ef('followup','미이수자에 대한 대책·후속 조치',d.followup||'','textarea',null,true)}${ef('topic','교육과목',d.topic||'')}${ef('content','교육내용의 개요',d.content||'','textarea',null,true)}${ef('requests','요구사항 또는 건의사항',d.requests||'','textarea',null,true)}</div></div>${eduRowsSection('agenda','교육시간표',d.agenda||[{content:'강사소개 및 강의 내용 설명',minutes:'10'},{content:'주요 안전수칙 설명',minutes:'35'},{content:'작업방법 토론',minutes:'35'},{content:'재해사례 토론',minutes:'25'},{content:'요약 및 정리',minutes:'10'},{content:'건의사항 및 의견 청취',minutes:'5'}])}${eduRowsSection('attendee','안전교육 참석자 명단 (서명은 출력 후 자필)',d.attendees||Array.from({length:12},()=>({})))}<div class="edu-panel"><h3>작성자 · 결재 · 기타</h3><div class="formgrid">${ef('author','작성자',d.author||'')}${ef('teacherApproval','교육담당자',d.teacherApproval||'')}${ef('supervisorApproval','관리감독자',d.supervisorApproval||'')}${ef('notes','기타사항',d.notes||'','textarea',null,true)}</div></div>${eduPhotoEditor('journal')}`}
function eduTBMFields(d){let hazards=d.hazards?.length?d.hazards:[{},{},{}];return `${eduCommon(d,'tbm')}<div class="edu-panel"><h3>잠재 위험 요인 · 위험성 개선 대책 (1~3)</h3><p class="smalltext muted">위험성평가·아차사고, 순회점검·기기점검·안전점검의 미흡사항을 반영하고 제거 → 대체 → 통제 순서로 대책을 검토합니다.</p>${hazards.map((h,i)=>`<div class="edu-hazard" data-edu-hazard="${i}"><b>${i+1}</b><input class="input" data-hz="factor" value="${esc(h.factor||'')}" placeholder="잠재 위험 요인"><input class="input" data-hz="measure" value="${esc(h.measure||'')}" placeholder="위험성 개선 대책"><select data-hz="checked"><option value="">조치 여부</option>${['예','아니오'].map(x=>`<option ${h.checked===x?'selected':''}>${x}</option>`).join('')}</select><input class="input" data-hz="result" value="${esc(h.result||'')}" placeholder="조치 결과 또는 향후 계획"></div>`).join('')}<div class="formgrid">${ef('priority','중점 위험 요인(위 1~3번 중 선정)',d.priority||'','text',['1','2','3'])}${ef('improvement','중점 위험 요인 개선 결과',d.improvement||'','textarea',null,true)}</div></div><div class="edu-panel"><h3>관리감독자 확인 · 작업 전 안전점검 결과</h3><div class="formgrid">${ef('supervisorDept','관리감독자 소속',d.supervisorDept||'')}${ef('supervisorRole','직책',d.supervisorRole||'')}${ef('supervisorName','성명',d.supervisorName||'')}${ef('feedback','근로자 의견·건의사항 및 차기 TBM 환류',d.feedback||'','textarea',null,true)}</div></div>${eduPhotoEditor('tbm')}${eduRowsSection('attendee','참석자 확인 (서명은 출력 후 자필)',d.attendees||Array.from({length:9},()=>({})))}`}
function eduCheckGroup(name,label,options,values,multiple=false){let chosen=(values||'').split(', ').filter(Boolean);return `<div class="field wide"><label>${esc(label)}</label><div class="edu-checks">${options.map(x=>`<label><input type="${multiple?'checkbox':'radio'}" name="${esc(name)}" data-edu-choice="${esc(name)}" value="${esc(x)}" ${chosen.includes(x)?'checked':''}> ${esc(x)}</label>`).join('')}</div></div>`}
function eduRiskChange(d){return `<div class="edu-panel"><h3>유해·위험요인 개선대책</h3><div class="formgrid">${ef('beforeLikelihood','개선 전 가능성(빈도)',d.beforeLikelihood||'','number')}${ef('beforeSeverity','개선 전 중대성(강도)',d.beforeSeverity||'','number')}${ef('afterLikelihood','개선 후 가능성(빈도)',d.afterLikelihood||'','number')}${ef('afterSeverity','개선 후 중대성(강도)',d.afterSeverity||'','number')}</div><p class="smalltext muted">원본 양식은 개선 전후 빈도와 강도를 각각 기록합니다. 평정기준과 점수는 사업장 평가 기준에 따라 확인하세요.</p></div>`}
function eduSuggestionFields(d){return `<div class="edu-panel"><h3>1. 안전·보건 제안자</h3><div class="formgrid">${ef('name','제안명(기록 제목)',d.name||'')}${ef('place','장소',d.place||'')}${ef('submissionDate','제출일시',d.submissionDate||'','datetime-local')}${ef('affiliation','소속',d.affiliation||'')}${ef('grade','직급',d.grade||'')}${ef('reporter','성명',d.reporter||'')}${eduCheckGroup('reporterType','제안자 구분',['임직원','협력업체','고객','교육생'],d.reporterType)}</div></div><div class="edu-panel"><h3>2. 분야</h3>${eduCheckGroup('category','분야(복수 선택)',['시설물 안전','설비/기계','안전경영','제도(규정, 규칙) 운영','건강관리(보건)','감정/심리','작업환경','기타'],d.category,true)}</div><div class="edu-panel"><h3>3. 안전·보건 제안 내용</h3><div class="formgrid">${ef('purpose','제안목적',d.purpose||'','textarea',null,true)}${ef('current','현황 및 문제점',d.current||'','textarea',null,true)}${ef('improvement','개선방안',d.improvement||'','textarea',null,true)}${ef('expected','기대효과',d.expected||'','textarea',null,true)}</div></div>${eduRiskChange(d)}<div class="edu-panel"><h3>4. 개선 대책(조치 내용)</h3><div class="formgrid">${ef('action','개선 대책(조치 내용)',d.action||'','textarea',null,true)}</div></div>${eduPhotoEditor('suggestion')}`}
function eduNearMissFields(d){return `<div class="edu-panel"><h3>1. 작성자</h3><div class="formgrid">${ef('writerDate','작성일',d.writerDate||today(),'date')}${ef('rank','직급',d.rank||'')}${ef('author','성명',d.author||'')}</div></div><div class="edu-panel"><h3>2. 사고사례</h3><div class="formgrid">${ef('name','사례명',d.name||'')}${ef('eventDate','발생일시',d.eventDate||'','datetime-local')}${ef('trigger','기인물(장소·설비·물질)',d.trigger||'')}${ef('overview','사고 개요(6하 원칙)',d.overview||'','textarea',null,true)}${ef('cause','사고발생 원인',d.cause||'','textarea',null,true)}${eduCheckGroup('accidentType','사고 유형',['끼임·골절','추락·전도','감전','화재·폭발','기타'],d.accidentType,true)}${eduCheckGroup('diseaseType','질병 유형',['진폐','중독','난청','요통','기타'],d.diseaseType,true)}</div></div>${eduRiskChange(d)}<div class="edu-panel"><h3>3. 재발방지 대책(조치 내용)</h3><div class="formgrid">${ef('action','재발방지 대책(조치 내용)',d.action||'','textarea',null,true)}</div></div>${eduPhotoEditor('nearmiss')}`}
function eduForm(){let d=state.draft||{},kind=d.template||state.eduType||'journal';if(!eduTemplates[kind])kind='journal';state.eduType=kind;let body=kind==='plan'?eduPlanFields(d):kind==='lesson'?eduLessonFields(d):kind==='journal'?eduJournalFields(d):kind==='tbm'?eduTBMFields(d):kind==='suggestion'?eduSuggestionFields(d):kind==='nearmiss'?eduNearMissFields(d):`<div class="edu-panel"><h3>교육 사진 기본 정보</h3><div class="formgrid">${ef('name','교육명',d.name||'')}${ef('date','교육일자',d.date||today(),'date')}</div></div>${eduPhotoEditor('photos')}`;return `${head('education',eduTemplates[kind].description,`<button class="btn" data-act="back">교육 목록</button>`)}<div class="notice">출처: ${esc(eduTemplates[kind].source)} · 이 화면의 양식은 첨부 문서의 항목을 옮긴 것입니다. 사진과 사진설명은 저장되지 않으며 양식을 벗어나면 초기화됩니다. 출력용 서명칸은 빈칸으로 남습니다.</div><form class="edu-form card pad" id="education-form" data-template="${kind}"><span class="overline">TS SPIDER / SAFETY EDUCATION</span><h2>${esc(eduTemplates[kind].title)}</h2>${body}<div class="formactions"><button type="button" class="btn" data-act="back">취소</button><button type="button" class="btn" data-act="print">↧ 현재 양식 PDF</button>${kind==='photos'?'':`<button type="submit" class="btn primary">내용 저장</button>`}</div></form><div class="card pad" style="margin-top:14px"><h2 class="cardtitle">관련 법령</h2>${legalHTML('education')}<a class="btn small" href="https://www.law.go.kr/법령/산업안전보건법시행규칙/제26조" target="_blank" rel="noopener noreferrer">시행규칙 제26조 · 별표 4·5 확인 ↗</a></div>`}
function eduTypesGuide(){return `<div class="card pad edu-guide"><h2 class="cardtitle">교육 종류 · 교육내용</h2><p class="muted smalltext">출처: 「안전보건교육의 종류.pdf」 1~9쪽. 분류와 주제는 첨부자료를 옮겼으며 실제 적용 교육시간·대상·교육내용은 현행 시행규칙 별표 4·5와 사업장 여건을 확인하세요.</p><div class="edu-kind-grid">${eduKinds.map(([name,basis,content,source])=>`<article><strong>${esc(name)}</strong><small>${esc(basis)} · ${esc(source)}</small><p>${esc(content)}</p><button class="btn small" data-edu-kind="${esc(name)}">이 교육으로 계획서 작성 →</button></article>`).join('')}</div><details><summary>특별교육 대상 작업 목록 39개 펼치기</summary><p class="smalltext muted">아래는 첨부자료 2~8쪽의 작업명을 찾기 쉽도록 간략히 표시한 목록입니다. 각 작업의 세부 적용요건과 교육내용은 시행규칙 별표 5의 원문을 확인하세요.</p><input class="input search" id="edu-special-query" placeholder="특별교육 대상 작업 검색" aria-label="특별교육 대상 작업 검색"><ol class="edu-special-list">${eduSpecialWorks.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></details><div class="toolbar"><a class="btn" href="https://www.law.go.kr/법령/산업안전보건법시행규칙/제26조" target="_blank" rel="noopener noreferrer">현행 시행규칙 제26조 확인 ↗</a>${legalHTML('education')}</div></div>`}
function eduWorkflowGuide(){return `<div class="grid split"><div class="card pad"><h2 class="cardtitle">자체 안전보건교육 · 4단계</h2>${[['01 계획 수립','교육 대상·종류·교안·강사를 정하고 내부 결재','plan'],['02 교육자료','현장 위험성, 재해사례·예방대책을 반영한 자료 준비','lesson'],['03 교육 진행','일시·시간·대상·방법 사전공지 후 교육과 의견 공유','journal'],['04 결과 등록','계획·교안·교육사진·교육일지를 모아 결과 등록','journal']].map(([num,description,key])=>`<div class="edu-step"><b>${num}</b><p>${description}</p><button class="btn small" data-edu-template="${key}">양식 작성 →</button></div>`).join('')}<p class="smalltext muted">출처: 「자체 안전보건교육 실시방법 및 양식.pdf」 1~3쪽. 출석·질의·피드백을 사실대로 기록합니다.</p></div><div class="card pad"><h2 class="cardtitle">TBM · 현장형 단시간 교육</h2>${[['사전 준비','작업·공정 위험성평가, 사고사례, 작업내용과 작업 전 조치사항 준비'],['실행','건강상태·잠재위험·중점위험을 함께 확인하고 개선대책·작업조치를 공유'],['환류','미조치 사항과 근로자 의견을 확인하여 다음 TBM에 반영']].map(([t,d])=>`<div class="edu-step"><b>${t}</b><p>${d}</p></div>`).join('')}<button class="btn primary" data-edu-template="tbm">TBM 교육일지 작성 →</button><p class="smalltext muted">출처: 「현장형 단시간 안전보건교육 방법.pdf」 1~4쪽. 원본의 필수 안전 수칙 그림은 저작물 이미지를 복제하지 않았습니다.</p></div></div>`}
function eduList(){let items=records.filter(r=>r.module==='education').sort((a,b)=>b.updated.localeCompare(a.updated));return `${head('education','교육 종류·계획·교안·교육일지·현장형 TBM을 한곳에서 작성하고 출력합니다.')}<div class="tabs">${[['records','교육 기록'],['types','교육 종류·대상'],['workflow','실시 절차·TBM']].map(([key,label])=>`<button class="${state.eduTab===key?'active':''}" data-edu-tab="${key}">${label}</button>`).join('')}</div>${state.eduTab==='types'?eduTypesGuide():state.eduTab==='workflow'?eduWorkflowGuide():`<div class="edu-kind-grid edu-picker">${Object.entries(eduTemplates).map(([key,x])=>`<button type="button" data-edu-template="${key}"><span class="overline">${esc(x.source.split(' · ')[1]||'')}</span><b>${esc(x.title)}</b><small>${esc(x.description)}</small><span>작성하기 →</span></button>`).join('')}</div><div class="card pad" style="margin-top:17px"><h2 class="cardtitle">등록된 교육 기록 · ${items.length}건</h2><div class="tablewrap mobile-table-wrap"><table class="table mobile-cards"><thead><tr><th>양식</th><th>교육·작업명</th><th>실시일</th><th>유형</th><th>관리</th></tr></thead><tbody>${items.map(r=>`<tr><td data-label="양식">${esc(eduTemplates[r.data.template]?.title||'기존 교육 기록')}</td><td data-label="교육·작업명"><strong>${esc(r.data.name||'제목 없음')}</strong></td><td data-label="실시일">${esc(r.data.date||'—')}</td><td data-label="유형">${esc(r.data.type||'—')}</td><td data-label="관리"><button class="btn small" data-open="${r.id}">보기</button></td></tr>`).join('')||'<tr class="empty-row"><td colspan="5"><div class="empty">아직 교육 기록이 없습니다. 위 양식을 선택해 시작하세요.</div></td></tr>'}</tbody></table></div></div>`}`}
function eduDetail(){let r=records.find(x=>x.id===state.viewId);if(!r)return eduList();let d=r.data,k=d.template||'journal',label=eduTemplates[k]?.title||'기존 교육 기록';return `${head('education','저장된 교육 기록을 확인합니다.',`<button class="btn" data-act="back">목록</button><button class="btn primary" data-edit="${r.id}">수정</button>`)}<div class="card pad"><span class="overline">${esc(label)} · NO. ${esc(r.id.slice(0,8))}</span><h2>${esc(d.name||'제목 없음')}</h2><div class="detail"><dl>${(k==='suggestion'?[['제출일시','submissionDate'],['장소','place'],['제안자','reporter'],['소속','affiliation'],['분야','category'],['제안목적','purpose'],['현황 및 문제점','current'],['개선방안','improvement'],['기대효과','expected'],['조치 내용','action']]:k==='nearmiss'?[['발생일시','eventDate'],['작성자','author'],['기인물','trigger'],['사고 개요','overview'],['사고 원인','cause'],['사고 유형','accidentType'],['질병 유형','diseaseType'],['재발방지 대책','action']]:[['교육 구분','type'],['일자','date'],['시작','startTime'],['종료','endTime'],['강사','instructor'],['교육 장소','place'],['교육 내용','topic'],['진행 내용','content'],['후속 조치','followup']]).filter(([,x])=>d[x]).map(([l,x])=>`<div><dt>${l}</dt><dd>${esc(d[x])}</dd></div>`).join('')}</dl></div><div class="toolbar"><button class="btn" data-act="print">↧ 작성된 양식 PDF</button>${['suggestion','nearmiss'].includes(k)?`<button class="btn" data-edit="${r.id}">전·후 사진 첨부 후 출력</button>`:`<button class="btn" data-edu-template="photos">교육사진 양식 출력</button>`}</div><p class="smalltext muted">사진은 기록에 저장되지 않습니다. 교육사진 양식에서 임시 첨부한 뒤 바로 출력하세요. 서명은 인쇄물에 자필로 기재합니다.</p></div>`}
function educationView(){return state.mode==='form'?eduForm():state.mode==='detail'?eduDetail():eduList()}
function tbmRecords(){return records.filter(r=>(r.module==='education'&&r.data.template==='tbm')||r.module==='tbm').sort((a,b)=>b.updated.localeCompare(a.updated))}

function legacyTBMData(d){let date=(d.date||'').slice(0,10),time=(d.date||'').slice(11,16);return {template:'tbm',legacy:true,name:d.name||'',date,startTime:time,place:d.place||'',workContent:d.name||'',supervisorName:d.lead||'',feedback:d.confirmation||'',hazards:[{factor:d.hazards||'',measure:d.measures||'',checked:'',result:''},{},{}],attendees:(d.workers||'').split(/[,\n]/).map(x=>x.trim()).filter(Boolean).map(name=>({name}))}}
function collectEdu(){let form=document.getElementById('education-form');if(!form)return null;let d=gatherForm('#education-form');d.template=form.dataset.template;if(d.template==='suggestion')d.date=(d.submissionDate||'').slice(0,10);if(d.template==='nearmiss')d.date=(d.eventDate||d.writerDate||'').slice(0,10);if(d.template==='plan')d.method=[...document.querySelectorAll('[data-edu-method]:checked')].map(el=>el.value).join(', ');if(['suggestion','nearmiss'].includes(d.template))for(const name of ['reporterType','category','accidentType','diseaseType']){let inputs=[...document.querySelectorAll(`[data-edu-choice="${name}"]:checked`)];d[name]=inputs.map(el=>el.value).join(', ');}if(d.template==='lesson'||d.template==='journal'||d.template==='tbm'){
 for(const [type,key] of [['lesson','lessonRows'],['agenda','agenda'],['attendee','attendees']]){let root=document.querySelector(`[data-edu-list="${type}"]`);if(!root)continue;d[key]=[...root.querySelectorAll('.edu-line')].map(line=>{let item={};line.querySelectorAll('[data-col]').forEach(el=>item[el.dataset.col]=el.value.trim());return item}).filter(item=>Object.values(item).some(Boolean))}
 }if(d.template==='tbm')d.hazards=[...document.querySelectorAll('[data-edu-hazard]')].map(row=>{let item={};row.querySelectorAll('[data-hz]').forEach(el=>item[el.dataset.hz]=el.value.trim());return item});if(d.template==='lesson')d.type='교안';if(d.template==='tbm')d.type='TBM·단시간 교육';return d}
function validateEdu(d){if(!d.name||!d.date)throw Error('교육·작업명과 날짜를 입력하세요.');if(['plan','journal'].includes(d.template)&&!d.type)throw Error('교육 구분을 선택하세요.');if(d.template==='photos')return;let countKeys=['targetCount','completedCount','missingCount'];if(countKeys.every(k=>d[k]!==undefined&&d[k]!=='')){let n=countKeys.map(k=>Number(d[k]));if(n.some(x=>!Number.isInteger(x)||x<0)||n[1]+n[2]!==n[0])throw Error('교육 대상자 수는 이수자 수와 미이수자 수의 합과 일치해야 합니다.')}if(d.template==='journal'&&d.duration&&d.agenda?.length){let total=d.agenda.reduce((n,x)=>n+(Number(x.minutes)||0),0);if(total&&total!==Number(d.duration))throw Error(`교육시간표 합계 ${total}분과 입력한 교육시간 ${d.duration}분이 다릅니다.`)}}

function tbmAttendance(attendees){let tables=[];for(let offset=0;offset<Math.max(9,attendees.length);offset+=9){let rows=Array.from({length:3},(_,i)=>{let a=attendees[offset+i]||{},b=attendees[offset+i+3]||{},c=attendees[offset+i+6]||{};return [a.dept||'',a.name||'',b.dept||'',b.name||'',c.dept||'',c.name||'']});tables.push(`<div class="edu-attendance-three">${edTable(['소속','성명','소속','성명','소속','성명'],rows)}</div>`)}return tables.join('')}

 else if(type==='journal'||!eduTemplates[type]){let agenda=d.agenda||[],sum=agenda.reduce((n,x)=>n+(Number(x.minutes)||0),0),attendees=d.attendees||[];body=edSection('교육 구분 · 인원 · 내용',`${common}${edTable(['교육 대상자 수','교육 이수자 수','교육 미이수자 수','미이수자 후속 조치'],[[d.targetCount,d.completedCount,d.missingCount,d.followup]])}${edTable(['교육과목','교육내용의 개요','요구사항 또는 건의사항'],[[d.topic||d.name,d.content,d.requests]])}`)+edSection('교육시간표',edTable(['교육내용','교육 시간(분)'],[...agenda.map(x=>[x.content,x.minutes]),['합계',sum?`${sum}분`:'']]))+edSection('강사 및 장소 · 기타사항',`${edTable(['강사 성명','교육 자격','교육 장소','기타사항'],[[d.instructor,d.qualification,d.place,d.notes]])}${edTable(['교육담당자','관리감독자'],[[`${d.teacherApproval||''} (서명:             )`,`${d.supervisorApproval||''} (서명:             )`]])}`)+edSection('안전교육 참석자 명단',journalAttendance(attendees));body+=edPhotos('journal',true)}
 else if(type==='suggestion'){body=edSection('실시방법',`<p>근로자 또는 고객 등이 발견한 잠재적인 유해·위험요인 및 개선이 필요한 사항을 안전보건 관련 제안 및 신고 제도를 통해 파악합니다.</p>`)+edSection('1. 제안자',`${edTable(['장소','제출일시','소속','구분'],[[d.place,d.submissionDate,d.affiliation,d.reporterType]])}${edTable(['직급','성명','분야'],[[d.grade,d.reporter,d.category]])}`)+edSection('2. 안전·보건 제안 내용',edTable(['제안목적','현황 및 문제점','개선방안','기대효과'],[[d.purpose,d.current,d.improvement,d.expected]]))+edSection('3. 유해·위험요인 개선대책',`${eduRiskChangeReport(d)}${edTable(['개선 대책(조치 내용)'],[[d.action]])}`)+edPhotos('suggestion')}
 else if(type==='nearmiss'){body=edSection('실시방법',`<p>사고·부상으로 이어질 뻔한 아차사고를 직접 경험한 근로자 등이 유해·위험요인을 제출합니다.</p>`)+edSection('1. 작성자',edTable(['작성일','직급','성명'],[[d.writerDate,d.rank,d.author]]))+edSection('2. 사고사례',`${edTable(['사례명','발생일시','기인물(장소·설비·물질)'],[[d.name,d.eventDate,d.trigger]])}${edTable(['사고 개요(6하 원칙)','사고발생 원인'],[[d.overview,d.cause]])}${edTable(['사고의 유형','질병의 유형'],[[d.accidentType,d.diseaseType]])}`)+edSection('3. 유해·위험요인 개선대책',`${eduRiskChangeReport(d)}${edTable(['재발방지 대책(조치 내용)'],[[d.action]])}`)+edPhotos('nearmiss')}
 else if(type==='photos')body=edPhotos('photos');
 else if(type==='tbm'){let hazards=d.hazards||Array.from({length:3},()=>({})),attendees=d.attendees||[];body=edSection('일시 · 작업명 · 작업 내용',`${edTable(['일시','날씨·기온','작업명','T.B.M 장소'],[[datetime,`${d.weather||''} ${d.temperature?`${d.temperature}℃`:''}`,d.name,d.place]])}${edTable(['작업 내용','위험성평가 실시 여부'],[[d.workContent,d.riskAssessed]])}`)+edSection('잠재 위험 요인 · 위험성 개선 대책',edTable(['NO','잠재 위험 요인','위험성 개선 대책'],hazards.map((x,i)=>[i+1,x.factor,x.measure])))+edSection('중점위험 요인 · 개선 결과',edTable(['중점위험 선정','개선 결과','관리감독자 확인'],[[d.priority?`${d.priority}번`:'' ,d.improvement,`${d.supervisorDept||''} / ${d.supervisorRole||''} / ${d.supervisorName||''} (서명:          )`]]))+edSection('작업 전 안전조치 확인',edTable(['NO','잠재 위험 요인(중점 포함)','조치 여부','조치 결과·향후 계획'],hazards.map((x,i)=>[i+1,x.factor,x.checked,x.result])))+edPhotos('tbm')+edSection('참석자 확인',tbmAttendance(attendees))+edSection('작업 전 안전점검 결과',`<p>${esc(d.feedback||'')}</p>`)}

document.addEventListener('click',e=>{let choice=e.target.closest('[data-edu-template]'),kind=e.target.closest('[data-edu-kind]'),tab=e.target.closest('[data-edu-tab]'),add=e.target.closest('[data-edu-add]'),remove=e.target.closest('[data-edu-remove]');if(kind){let row=eduKinds.find(x=>x[0]===kind.dataset.eduKind);if(row){resetEduPhotos();state.eduType='plan';setMode('form');state.draft={template:'plan',name:row[0]+' 계획',type:row[0],date:today(),topic:row[2]};render()}return}if(choice){let from=state.module==='education'&&state.mode==='detail'?records.find(r=>r.id===state.viewId)?.data:null;resetEduPhotos();if(state.module==='tbm')go('education');state.eduType=choice.dataset.eduTemplate;setMode('form');if(from&&state.eduType==='photos'){state.draft={template:'photos',name:from.name,date:from.date};render()}return}if(tab){state.eduTab=tab.dataset.eduTab;render();return}if(add){let list=document.querySelector(`[data-edu-list="${add.dataset.eduAdd}"]`);list?.insertAdjacentHTML('beforeend',eduRow(add.dataset.eduAdd));return}if(remove){remove.closest('.edu-line')?.remove()}});
document.addEventListener('input',e=>{if(e.target.id==='edu-special-query'){let q=e.target.value.trim().toLowerCase();document.querySelectorAll('.edu-special-list li').forEach(li=>li.hidden=!li.textContent.toLowerCase().includes(q));return}let input=e.target.closest('[data-edu-caption]');if(input&&eduPhotos[+input.dataset.eduCaption])eduPhotos[+input.dataset.eduCaption].caption=input.value});
document.addEventListener('change',e=>{let input=e.target.closest('[data-edu-photo]');if(!input)return;let file=input.files?.[0],idx=+input.dataset.eduPhoto;if(!file||!eduPhotos[idx])return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){input.value='';notify('JPEG, PNG, WebP 파일만 첨부할 수 있습니다.');return}if(file.size>20*1024*1024){input.value='';notify('사진 한 장은 20MB 이하로 선택하세요.');return}if(eduPhotos[idx].url)URL.revokeObjectURL(eduPhotos[idx].url);eduPhotos[idx].url=URL.createObjectURL(file);input.closest('.photo-box').querySelector('.preview').innerHTML=`<img src="${esc(eduPhotos[idx].url)}" alt="안전보건교육 사진 ${idx+1}">`});
document.addEventListener('submit',async e=>{if(e.target.id!=='education-form')return;e.preventDefault();let d=collectEdu();try{validateEdu(d);if(d.template==='photos')return notify('사진은 저장하지 않습니다. PDF 출력 버튼을 사용하세요.');await save(d,true)}catch(err){notify(err.message)}});

document.addEventListener('click',async e=>{let navEl=e.target.closest('[data-nav]'),create=e.target.closest('[data-create]'),kind=e.target.closest('[data-kind]'),act=e.target.closest('[data-act]'),open=e.target.closest('[data-open]'),edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]'),step=e.target.closest('[data-step]');if(navEl){go(navEl.dataset.nav);return}if(create){let dest=create.dataset.create;if(dest==='tbm'||dest==='education'){go('education');state.eduType=dest==='tbm'?'tbm':'journal';setMode('form')}else go(dest,'form');return}if(kind){state.kindFilter=kind.dataset.kind;render();return}if(open){if(open.dataset.module&&open.dataset.module!==state.module)go(open.dataset.module);setMode('detail',open.dataset.open);return}if(edit){setMode('form',edit.dataset.edit);return}if(del){removeRecord(del.dataset.delete);return}if(step){if(state.module==='risk'&&state.mode==='form'){gatherRisk();state.riskStep=+step.dataset.step;render();window.scrollTo(0,0)}return}if(!act){if(e.target.classList.contains('modalback'))document.getElementById('overlay').innerHTML='';return}let a=act.dataset.act;try{switch(a){case 'new':setMode('form');break;case 'back':setMode('list');break;case 'print':await printReport();break;case 'ai':aiModal();break;case 'settings':settings();break;case 'close':document.getElementById('overlay').innerHTML='';break;case 'save-config':{let url=document.getElementById('cfg-url').value.trim(),key=document.getElementById('cfg-key').value.trim(),fn=document.getElementById('cfg-fn').value.trim()||'spider-ai';if(url&&!/^https:\/\/[\w.-]+\.supabase\.co\/?$/.test(url))throw Error('Supabase URL은 https://...supabase.co 형식이어야 합니다.');if(key&&/sb_secret|service_role/i.test(key))throw Error('비밀 키 또는 service_role 키는 브라우저에 넣을 수 없습니다.');config={url,key,fn};localStorage.setItem(CFG,JSON.stringify(config));notify('연결 설정을 저장했습니다.');break}case 'copy-sql':copyText(sql());break;case 'login':{let email=document.getElementById('login-email').value.trim(),password=document.getElementById('login-password').value;if(!email||!password)throw Error('이메일과 비밀번호를 입력하세요.');if(!config.url||!config.key)throw Error('설정을 먼저 저장하세요.');await login(email,password);document.getElementById('overlay').innerHTML='';break}case 'logout':{session=null;cloud=false;localStorage.removeItem(SESSION);records=readJSON(KEY,[]);document.getElementById('overlay').innerHTML='';go('home');notify('로그아웃했습니다. 브라우저 기록으로 전환했습니다.');break}case 'run-ai':await runAI();break;case 'copy-prompt':copyText(buildPrompt());break;case 'copy-output':copyText(document.getElementById('ai-output').textContent);break;case 'exportjson':download(`TS스파이더_백업_${today()}.json`,JSON.stringify({app:'TS SPIDER',version:1,exported_at:new Date().toISOString(),records},null,2),'application/json');break;case 'exportcsv':exportCsv();break;case 'prev-month':state.calMonth--;if(state.calMonth<0){state.calMonth=11;state.calYear--}render();break;case 'next-month':state.calMonth++;if(state.calMonth>11){state.calMonth=0;state.calYear++}render();break;case 'add-section':{let root=document.getElementById('sections');let el=document.createElement('div');el.innerHTML=`<div class="sectionband" data-section="new"><div class="toolbar"><input class="input" data-section-title placeholder="구분 이름"><button type="button" class="btn small danger" data-act="remove-section">삭제</button></div><div class="items"></div><button type="button" class="btn small" data-act="add-item">＋ 세부 항목 추가</button></div>`;root.appendChild(el.firstElementChild);break}case 'remove-section':act.closest('.sectionband').remove();break;case 'add-item':act.closest('.sectionband').querySelector('.items').insertAdjacentHTML('beforeend',`<div class="itemrow check"><input class="input" data-item-name placeholder="세부 항목"><input class="input" data-item-detail placeholder="점검 내용"><select data-item-result><option>미점검</option><option>적합</option><option>부적합</option><option>해당 없음</option></select><input class="input" data-item-note placeholder="결과 메모"><button type="button" class="btn small danger" data-act="remove-item" aria-label="점검 항목 삭제">삭제</button></div>`);break;case 'remove-item':act.closest('.itemrow').remove();break;case 'add-hazard':document.getElementById('hazards').insertAdjacentHTML('beforeend',hazardRow());break;case 'remove-hazard':act.closest('.itemrow').remove();break;case 'next-step':case 'prev-step':gatherRisk();state.riskStep=Math.max(0,Math.min(7,state.riskStep+(a==='next-step'?1:-1)));render();window.scrollTo(0,0);break;case 'save-draft':gatherRisk();await save(state.draft,true);break}}catch(err){notify(err.message)}});
document.addEventListener('input',e=>{if(e.target.id==='q'){state.filter=e.target.value;let data=filteredRecords(state.module),body=document.getElementById('records-body'),count=document.querySelector('[data-count=filtered]');if(body)body.innerHTML=recordRows(data);if(count)count.textContent=String(data.length);return}if(e.target.matches('[data-h="likelihood"],[data-h="severity"]')){let row=e.target.closest('.itemrow'),n=+row.querySelector('[data-h="likelihood"]').value,m=+row.querySelector('[data-h="severity"]').value;row.querySelector('[data-score]').textContent=riskLevel(n*m)}});
document.addEventListener('change',async e=>{if(e.target.id==='status-filter'){state.statusFilter=e.target.value;render()}if(e.target.id==='import-file'){try{let data=JSON.parse(await e.target.files[0].text());if(data.app!=='TS SPIDER'||!Array.isArray(data.records))throw Error('TS 스파이더 백업 파일이 아닙니다.');if(!confirm(`${data.records.length}건을 현재 저장 공간에 병합할까요?`))return;for(let r of data.records){if(!r.id||(!configs[r.module]&&r.module!=='timelineTask')||typeof r.data!=='object'||!r.data)continue;await persist({id:r.id,module:r.module,data:r.data,created:r.created||new Date().toISOString(),updated:r.updated||new Date().toISOString()})}render();notify('백업 파일을 병합했습니다.')}catch(err){notify(`복원 실패: ${err.message}`)}}});
document.addEventListener('submit',async e=>{if(!['record-form','risk-form'].includes(e.target.id))return;e.preventDefault();if(e.target.id==='record-form'){let d=gatherForm('#record-form');if(state.module==='checklist'){d.sections=gatherCheck();if(!d.sections.length||d.sections.some(s=>!s.name||!s.items.length||s.items.some(i=>!i.name)))return notify('구분명과 세부 항목을 입력하세요.')}await save(d)}else{gatherRisk();let d=state.draft;if(!d.name||!d.type||!d.startDate||!d.process)return notify('사전 준비 단계의 필수 항목을 모두 입력하세요.');if(!d.participants)return notify('근로자 참여 명단을 입력하세요.');if(!d.hazards?.length||d.hazards.some(h=>!h.hazard||!h.process||!Number.isInteger(+h.likelihood)||+h.likelihood<1||+h.likelihood>5||!Number.isInteger(+h.severity)||+h.severity<1||+h.severity>4))return notify('평가표에 공정·위험요인과 빈도 1~5, 강도 1~4를 입력하세요.');await save(d)}});
function syncCaptions(){document.querySelectorAll('#photo-pairs [data-photo-index]').forEach(el=>{let n=+el.dataset.photoIndex;if(photoPairs[n])photoPairs[n].caption=el.querySelector('.photo-caption')?.value.trim()||''})}
document.addEventListener('click',async e=>{
 let tab=e.target.closest('[data-spot-tab]'),log=e.target.closest('[data-timelog]'),action=e.target.closest('[data-act]');
 if(tab){gatherSpot();for(let pair of photoPairs)for(let key of ['beforeURL','afterURL'])if(pair[key])URL.revokeObjectURL(pair[key]);photoPairs=[{}];state.spotType=+tab.dataset.spotTab;spotForm.results=[];spotForm.issue='';render();return}
 if(log){timelineLog(log.dataset.timelog);return}
 if(!action)return;
 switch(action.dataset.act){
  case 'photo-report': photoPairs=[{}];setMode('photo',state.viewId);break;
  case 'photo-back': setMode('detail',state.viewId);break;
  case 'add-photo': syncCaptions();photoPairs.push({});document.getElementById('photo-pairs').insertAdjacentHTML('beforeend',photoPairHTML({},photoPairs.length-1));break;
  case 'remove-photo': {syncCaptions();let idx=+action.closest('[data-photo-index]').dataset.photoIndex,pair=photoPairs[idx];for(let key of ['beforeURL','afterURL'])if(pair[key])URL.revokeObjectURL(pair[key]);photoPairs.splice(idx,1);document.getElementById('photo-pairs').innerHTML=photoPairs.map((p,i)=>photoPairHTML(p,i)).join('');break}
  case 'save-timelog': try{await saveTimelog()}catch(err){notify(`기록 실패: ${err.message}`)}break;
 }
});
document.addEventListener('change',e=>{
 if(e.target.id==='timeline-filter'){state.timelineMonth=e.target.value;render();return}
 if(!e.target.matches('[data-photo-side]'))return;
 const input=e.target,index=+input.closest('[data-photo-index]').dataset.photoIndex,pair=photoPairs[index],side=input.dataset.photoSide,file=input.files?.[0];
 if(!pair||!file)return;
 if(!['image/png','image/jpeg','image/webp'].includes(file.type)){input.value='';notify('PNG, JPEG 또는 WebP 사진만 선택할 수 있습니다.');return}
 if(file.size>20*1024*1024){input.value='';notify('사진 한 장은 20MB 이하로 선택하세요.');return}
 if(pair[side+'URL'])URL.revokeObjectURL(pair[side+'URL']);
 pair[side+'URL']=URL.createObjectURL(file);
 input.closest('.photo-box').querySelector('.preview').innerHTML=`<img src="${esc(pair[side+'URL'])}" alt="${side==='before'?'개선 전':'개선 후'} 사진">`;
 // Neither the File object nor image bytes are copied into records, localStorage or Supabase.
});
document.addEventListener('input',e=>{if(e.target.matches('.photo-caption'))syncCaptions()});
window.addEventListener('hashchange',()=>{let next=location.hash.slice(1);if(next!==state.module&&(configs[next]||['home','law','data','timeline','spot444'].includes(next)))go(next)});
window.addEventListener('beforeunload',clearTemporary);
window.addEventListener('pagehide',clearTemporary);
async function init(){records=readJSON(KEY,[]);let hash=location.hash.slice(1);if(configs[hash]||['home','law','data','timeline','spot444'].includes(hash))state.module=hash;if(session&&config.url&&config.key){try{await loadCloud();cloud=true}catch(e){notify(`클라우드 연결 실패: ${e.message} 브라우저 기록을 표시합니다.`);records=readJSON(KEY,[]);cloud=false}}render()}init();
</script></body></html>
